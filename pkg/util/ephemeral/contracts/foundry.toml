# Builds the contracts the trackers embed: forge build writes out/<File>.sol/<Contract>.json, whose
# abi and bytecode.object are the abi and bytecode of the JSON file in the dex's ABI directory.
[profile.default]
src = '.'
out = 'out'
solc_version = '0.8.37'
# Not the compiler's default: a contract runs on whatever chain its pool lives on, and opcodes newer
# than Cancun are not live on all of them.
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
# Every contract runs as init code inside one eth_call, never deployed, so the deployed bytecode size
# limit does not apply and runtime gas matters more than code size.
via_ir = true
# No metadata hash, so the creation code is the same on every rebuild.
bytecode_hash = 'none'
cbor_metadata = false
ignored_error_codes = [3860]
